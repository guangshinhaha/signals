name: ci
# Docs-only changes run only the secret scan inside the shared workflow (not with paths-ignore),
# so the required `gantry / ci-ok` check still reports.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its run still in flight. Main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gantry:
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: read
    # with:
    #   runs-on: '["self-hosted","gantry"]'   # once your runner is up
    #   e2e: true
    #   node: false   # if this repo's own workflow runs its tests
