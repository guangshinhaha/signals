name: risky-paths
# Labels PRs `needs-human` when they touch paths listed in
# .github/gantry-risky-paths. Off until that file exists. Same-repo PRs only.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: risky-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  risky-paths:
    uses: guangshinhaha/gantry/.github/workflows/risky-paths.yml@main
    permissions:
      contents: read
      pull-requests: write
